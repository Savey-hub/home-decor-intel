udy/202404/19151344k6dc.jpg\" style=\"width: 1050px; height: 606px;\" /></span></p>\r\n<p><span style=\"font-size:18px;\"><span style=\"color:#ff8c00;\"><strong>这是因为我们在DMP人群报表中存在复算逻辑！请看下面介绍：</strong></span></span></p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p><span style=\"font-size:18px;\"><strong>一.&nbsp;人群报表触发复算介绍：</strong></span></p>\r\n<p>&nbsp;</p>\r\n<p><span style=\"font-size:16px;\">如下图所示，对于被曝光的用户<span style=\"color:#ff0000;\">赵六</span>，如果圈中他的是同一个单元下多个（两个及以上）溢价系数相同的人群，则触发人群包之间的复算逻辑（即重复计算），其中单元效果报表的汇总数是去重的。</span></p>\r\n<p><span style=\"font-size:16px;\"><img alt=\"\" src=\"https://storage.jd.com/jtz.file.cloudy/202404/19151404du11.jpg\" style=\"width: 1050px; height: 291px;\" /></span></p>\r\n<p><span style=\"font-size:16px;\"><strong>a、复算：</strong>广告主进行人群定向投放时，如果某个单元下多个人群（两个及以上）的重复用户被曝光，且多个人群的溢价系数相同，则多个人群的数据报表中该条曝光效果数据均会计算展示<strong>（广告扣费仅执行一次）</strong>。触发复算逻辑后，这个单元下的各个人群效果报表数据之和会大于单元效果报表数据</span></p>\r\n<p><span style=\"font-size:16px;\"><strong>b、去重：</strong>单元效果报表中的数据是去重后的结果，不受复算效果的影响。</span></p>\r\n<p><strong><span style=\"font-size:16px;\">举个例子：</span></strong></p>\r\n<p><span style=\"font-size:16px;\">① 单元A只引用了a，b，c三个定向人群，三个人群中存在重叠用户，如果实际出价相同并且竞价成功，便会触发复算逻辑，效果数据就会出现以下情况：单元效果报表A＜人群a+人群b＋人群c。</span></p>\r\n<p><span style=\"font-size:16px;\">② 单元B只引用了两个完全相同的定向人群d和e，如果这两个人群出价相同并且竞价成功，复算逻辑就会生效，人群粒度下的报表数据将会分别在两个人群中展示，并且效果数据中单元B=人群d=人群e。</span></p>\r\n<p><span style=\"font-size:16px;\">③ 如果某单元中的所有定向人群之间<strong>没有重叠或存在重叠但是设置的溢价系数不同</strong>，都不会触发复算逻辑，此时单元报表的效果数据等于各个人群报表的数据之和。</span></p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p><span style=\"font-size:18px;\"><strong>二.&nbsp;问题解答</strong></span></p>\r\n<p>&nbsp;</p>\r\n<p><strong><span style=\"font-size:16px;\">1. 为什么进行复算？</span></strong></p>\r\n<p><span style=\"font-size:16px;\">a、复算逻辑将已曝光的各个定向人群包的所有人群效果均统计，可以客观的表达每一个人群包的效果，方便广告主判断人群质量；</span></p>\r\n<p>&nbsp;</p>\r\n<p><strong><span style=\"font-size:16px;\">2. 触发复算时是否会重复进行广告扣费？</span></strong></p>\r\n<p><span style=\"font-size:16px;\">a、复算逻辑只是为了展示每一个人群包的效果，在单元报表总计中是去重的，触发复算逻辑时不会重复进行广告扣费，仅扣除一次。</span></p>\r\n<p>&nbsp;</p>\r\n<p><strong><span style=\"font-size:16px;\">3. 如何进行数据分析？</span></strong></p>\r\n<p><span style=\"font-size:16px;\">a、如果多个人群包效果数据类似，则很可能是由于这些人群包重合度较高导致的，可以选择投产比最高的或者展现最多的使用；</span></p>\r\n<p><span style=\"font-size:16px;\">b、如果想优先使用某一个人群包可以采用将其溢价系数调高的方式。</span></p>\r\n","viewCount":"247087","upCount":"194","attrName":"stageLabels","attrValue":"2","topLevelChannelId":"1749","attr":{"joint":"1","k2":"","metadescription":"","downloadurl":"","k3":"","stageLabels":"2","k4":"","courseEndDate":"","courseBeginDate":"","description2":"","description3":"","liveId":"","metakeywords":"","videoduration":"","description1":"","tagname":"","viewcases":"","viewdetails":"","metatitle":"","joyspaceUrl":"https://joyspace.jd.com/pages/AB4Jc8AyXIr2lYV1Aybj","price":""},"imgs":[],"store":false,"storeCount":"45","contentCompletion":false,"titleColor":"#FFFFFF","jcContentExt":{"contentId":3057,"title":"DMP效果数据复算&去重说明","typeImg":"https://storage.jd.com/jtz.file.cloudy/202404/19151201nh8m.jpg","description":"复算逻辑是将已曝光的各个DMP人群包中的所有人群效果得以展示，可以客观的表达人群效果，方便广告主判断人群质量；复算只是在人群效果展示中生效，在人群报表总计中是去重的，复算也不会影响任何广告花费和其他功能","titleColor":"#FFFFFF"},"contentTag":[{"contentId":3057,"tagId":366,"tagName":"dmp"},{"contentId":3057,"tagId":13,"tagName":"效果"},{"contentId":3057,"tagId":1324,"tagName":"数据复算"},{"contentId":3057,"tagId":1325,"tagName":"去重说明"}],"live":false},{"channelId":"2784","contentId":"17226","title":"秒送非外卖广告 | 门店推广操作指南","description":"为提升非外卖商家的营销效果，秒送商家端上线门店推广功能，推动门店生意持续增长","releaseDate":"2025-06-30 11:16:10","sortDate":"2025-08-18 17:32:16","typeImg":"https://storage.jd.com/jtz.file.cloudy/202508/12140845iz87.jpg","modelId":"1","viewCount":"246281","upCount":"7","attrName":"stageLabels","attrValue":"0","topLevelChannelId":"1749","attr":{"joint":"1","loginType":"0","metadescription":"","stageLabels":"0","description2":"","description3":"","videoduration":"","description1":"","tagname":"","viewcases":"","metatitle":"","price":"","auth
